<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2F6B5E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Panaderia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <div class="login-title">Panaderia</div>
      <div class="login-subtitle">¿Quien eres?</div>
      <div class="login-mode" id="login-mode">Conectando...</div>
      <button class="login-btn login-owner" onclick="loginAs('dueno')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/><path d="M13 4l1-1 1 1-1 1z"/></svg> Dueño</button>
      <button class="login-btn login-employee" onclick="loginAs('empleado')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M12 3l1 1-1 1-1-1 1-1z"/></svg> Empleado</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <header id="header">
      <button id="btn-menu" onclick="toggleMenu()">&#9776;</button>
      <button id="btn-back" class="hidden" onclick="goBack()">&#9664;</button>
      <h1 id="title">Panaderia</h1>
      <div id="rate-display" onclick="showRateOptions()">USD: --</div>
    </header>

    <div id="sidebar" class="sidebar hidden">
      <div class="sidebar-overlay" onclick="toggleMenu()"></div>
      <div class="sidebar-panel">
        <div class="sidebar-header">Menu</div>
        <div class="sidebar-item" onclick="sidebarGo('categories')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-7h6v7"/></svg> Inicio</div>
        <div class="sidebar-item" onclick="sidebarGo('records')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg> Registros</div>
        <div class="sidebar-item" onclick="sidebarGo('fiados')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg> Fiados</div>
        <div class="sidebar-item sidebar-owner" onclick="sidebarGo('edit')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Editar</div>
        <div class="sidebar-item sidebar-owner" onclick="sidebarGo('datos')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg> Datos</div>
        <div class="sidebar-item sidebar-logout" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg> Salir</div>
      </div>
    </div>

    <main id="main"></main>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <span id="modal-title"></span>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="fab" class="fab hidden" onclick="navigate('cart')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 3h3l2.5 12a2 2 0 0 0 2 1.5h8.5a2 2 0 0 0 2-1.6L21 8H6"/></svg>
      <span id="fab-badge" class="fab-badge"></span>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
